# PULSAR Lobby - SpacetimeDB server on a Debian 13 VPS (Docker).
#
# Topology: spacetimedb is reachable ONLY on the internal compose network;
# Caddy terminates TLS and reverse-proxies wss/https -> spacetimedb:3000.
# Port 3000 is never published to the host. See README.md for the runbook.
#
# Version is pinned to v2.5.0 to match the module (SpacetimeDB.Runtime 2.5.*)
# and the companion (SpacetimeDB.ClientSDK 2.5.*). Do NOT use :latest - a newer
# server may break protocol compatibility with the 2.5 client.

services:
  # One-shot: the spacetimedb container runs as the unprivileged "spacetime"
  # user (uid 1000), but freshly created named volumes are owned by root, so the
  # server can neither create /stdb/data nor write its JWT keys. This init fixes
  # ownership of both volumes once before the server starts. Idempotent and safe
  # on every (re)start.
  stdb-init:
    image: clockworklabs/spacetime:v2.5.0
    container_name: pulsar-stdb-init
    user: "0:0"
    entrypoint: ["sh", "-c", "mkdir -p /stdb/data /keys && chown -R 1000:1000 /stdb /keys"]
    volumes:
      - stdb-data:/stdb
      - stdb-keys:/keys
    restart: "no"

  spacetimedb:
    image: clockworklabs/spacetime:v2.5.0
    container_name: pulsar-stdb
    depends_on:
      stdb-init:
        condition: service_completed_successfully
    command: start --data-dir=/stdb/data
    expose:
      - "3000"
    volumes:
      - stdb-data:/stdb        # database state - MUST persist
      # JWT signing keys (id_ecdsa) live in the server's HOME, NOT in the data
      # dir. Without persisting them they regenerate on every container
      # recreation, invalidating EVERY previously issued token (clients AND the
      # publishing/owner CLI) -> 401 InvalidSignature. Persist them too.
      - stdb-keys:/home/spacetime/.config/spacetime
    restart: unless-stopped

  caddy:
    # Custom Caddy built WITH the rate-limit plugin (see Dockerfile.caddy) for the
    # per-IP anti-flood throttle in the Caddyfile. Stock caddy:2 has no rate limiting.
    build:
      context: .
      dockerfile: Dockerfile.caddy
    container_name: pulsar-caddy
    depends_on:
      - spacetimedb
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data       # persists the Let's Encrypt cert
      - caddy-config:/config
    restart: unless-stopped

  relay:
    build:
      context: ../relay
    container_name: pulsar-relay
    environment:
      PULSAR_RELAY_PORT: ${PULSAR_RELAY_PORT:-7777}
      PULSAR_STATS_PORT: 7778
    ports:
      - "${PULSAR_RELAY_PORT:-7777}:${PULSAR_RELAY_PORT:-7777}/udp"
    expose:
      - "7778"               # read-only session stats (monitoring) - internal only
    restart: unless-stopped

  # Live monitoring dashboard. Reads container metrics from the docker socket
  # (read-only) and lobby/account/relay state from SpacetimeDB's /sql endpoint.
  # Reachable only via Caddy (basic-auth) on monitor.<DOMAIN>; never published.
  monitor:
    build:
      context: ./monitor
    container_name: pulsar-monitor
    depends_on:
      - spacetimedb
    environment:
      STDB_URL: http://spacetimedb:3000
      DB_NAME: pulsar-lobby
      RELAY_CONTAINER: pulsar-relay
      RELAY_STATS_URL: http://relay:7778/
      CADDY_CONTAINER: pulsar-caddy
      CERT_HOST: ${DOMAIN}                # probed for TLS-cert expiry
      WATCH_CONTAINERS: pulsar-stdb,pulsar-caddy,pulsar-relay,pulsar-monitor
      # Publisher/owner identity - shown as a system connection, not a player.
      OWNER_IDENTITY: "0xc200e8cbe5bb04e3a2ccbbe0d96e48ead61a8fbd975ab488b48fc735c38a11aa"
    volumes:
      # Read-only docker socket -> container CPU/RAM/net stats and relay logs.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Owner token (read-only) so the monitor can query private tables too.
      - /root/.config/spacetime/cli.toml:/cli.toml:ro
      # Host root (read-only) for true host disk usage.
      - /:/host:ro
      # Persistent long-range time-series history (SQLite).
      - monitor-data:/data
    expose:
      - "8090"
    restart: unless-stopped

volumes:
  stdb-data:
  stdb-keys:
  caddy-data:
  caddy-config:
  monitor-data:
