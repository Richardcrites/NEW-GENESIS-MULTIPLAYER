# Genesis fork: builds the SFSE plugin and the tool on every push, so source changes
# are proven to compile without a local Visual Studio setup. Mirrors BUILD.md.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  plugin:
    runs-on: windows-latest
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply CommonLibSF patch
        working-directory: extern/CommonLibSF
        run: git apply ../../patches/commonlibsf.patch

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-${{ hashFiles('vcpkg.json') }}

      - name: Configure
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          cmake --preset release

      - name: Build PULSAR.dll
        run: cmake --build build/release --target PULSAR

      - uses: actions/upload-artifact@v4
        with:
          name: PULSAR-dll-RelWithDebInfo
          path: |
            build/release/PULSAR.dll
            build/release/PULSAR.pdb

  tool:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build tool and companion
        run: |
          dotnet build lobby/pulsar/Pulsar.csproj -c Release
          dotnet build lobby/companion/Companion.csproj -c Release

      - name: Test companion
        run: dotnet test lobby/companion.tests/Companion.Tests.csproj -c Release

      - name: Publish tool
        run: |
          dotnet publish lobby/pulsar/Pulsar.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out
          dotnet publish lobby/companion/Companion.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out

      - uses: actions/upload-artifact@v4
        with:
          name: Pulsar-tool-win-x64
          path: out

  # One ready-to-run download: Pulsar.exe + companion, with the mod payload staged in
  # mod/Data where the tool's "Install mod" button looks for it (ModInstaller).
  package:
    needs: [plugin, tool]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Pulsar-tool-win-x64
          path: dl/tool

      - uses: actions/download-artifact@v4
        with:
          name: PULSAR-dll-RelWithDebInfo
          path: dl/dll

      - name: Stage package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = "Genesis-Coop"
          $data  = "$stage/mod/Data"
          New-Item -ItemType Directory -Force "$data/SFSE/Plugins", "$data/Scripts" | Out-Null

          Copy-Item dl/tool/Pulsar.exe, dl/tool/PulsarCompanion.exe $stage
          Copy-Item dl/dll/PULSAR.dll "$data/SFSE/Plugins/PULSAR.dll"
          Copy-Item "data/PULSAR - Main.ba2" $data
          Copy-Item data/Scripts/*.pex "$data/Scripts"

          # Ship PULSAR.esp with the TES4 master flag set, as tools/package_release.ps1 does.
          $esp = [System.IO.File]::ReadAllBytes("$PWD/data/PULSAR.esp")
          if ([System.Text.Encoding]::ASCII.GetString($esp, 0, 4) -ne "TES4") { throw "PULSAR.esp has no TES4 header" }
          $esp[0x08] = $esp[0x08] -bor 0x01
          [System.IO.File]::WriteAllBytes("$PWD/$data/PULSAR.esp", $esp)

          Copy-Item LICENSE "$stage/LICENSE.txt"
          Copy-Item LICENSE-ADDITIONAL "$stage/LICENSE-ADDITIONAL.txt"
          Copy-Item GENESIS.md "$stage/GENESIS.md"
          Get-ChildItem -Recurse $stage | Select-Object FullName, Length | Format-Table -AutoSize

      - uses: actions/upload-artifact@v4
        with:
          name: Genesis-Coop-Windows
          path: Genesis-Coop
